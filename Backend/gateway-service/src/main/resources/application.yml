spring:
  application:
    name: GATEWAY-SERVICE
  cloud:
    gateway:
      server:
        webmvc:
          routes:
           - id: POSTS-SERVICE
             uri: lb://POSTS-SERVICE
             predicates:
               - Path=/api/posts/**
           - id: COMMENTS-SERVICE
             uri: lb://COMMENTS-SERVICE
             predicates:
               - Path=/api/comments/**
           - id: IDENTITY-SERVICE
             uri: lb://IDENTITY-SERVICE
             predicates:
               - Path=/auth/**						 
server:
  port: 8765
  
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetchRegistry: true
    registerWithEureka: true